# Docker-Compose fuer das optionale Such-Backend SearXNG (nur fuer quellen=["web"]).
#
# Secrets kommen aus einer .env-Datei im Repo-Root (NICHT eingecheckt).
# Start: docker compose -f deploy/docker-compose.yml up -d searxng
# Erwartete Variable (siehe .env.example): SEARXNG_SECRET
#
# Der Port ist nur auf localhost gebunden: settings.yml schaltet den Limiter ab, offen
# erreichbar waere die Instanz ein Proxy fuer beliebige Dritte.

services:
  searxng:
    image: searxng/searxng:2025.1.1-8a5d2f1
    container_name: rag-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      # Der Entrypoint ersetzt den Platzhalter in settings.yml mit diesem Wert.
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
